variables:
  - key: TEAMAI_JLINK_NODE
    value: "node"
    description: "Node command or member-local absolute executable path"
  - key: TEAMAI_JLINK_ENTRY
    value: ""
    description: "Required member-local absolute path to jlink-mcp 0.7.0 out/mcp/standalone.js; set with teamai env set"
  - key: TEAMAI_JLINK_INSTALL_DIR
    value: ""
    description: "Required member-local SEGGER J-Link installation directory; set with teamai env set"
  - key: TEAMAI_JLINK_DEVICE
    value: "Unspecified"
    description: "Initial device only; verify the actual target and use set_device before hardware operations"
  - key: TEAMAI_JLINK_INTERFACE
    value: "SWD"
    description: "Member target interface: SWD or JTAG"
  - key: TEAMAI_JLINK_SPEED
    value: "4000"
    description: "Member target connection speed in kHz"
